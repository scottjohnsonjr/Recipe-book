<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R&amp;S Recipe Book</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍞</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f3efe6;--surface:#fbf9f4;--ink:#2b2522;--muted:#6f655d;--line:#d9d1c3;--accent:#8a5a2b;--accent-ink:#fff;--danger:#a23b2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a17;--surface:#292320;--ink:#f1ebe0;--muted:#b3a89b;--line:#41382f;--accent:#d9a868;--accent-ink:#1e1a17;--danger:#e57a66}}
:root[data-theme="dark"]{--bg:#1e1a17;--surface:#292320;--ink:#f1ebe0;--muted:#b3a89b;--line:#41382f;--accent:#d9a868;--accent-ink:#1e1a17;--danger:#e57a66}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--logo) center 45%/min(92vw,640px) auto no-repeat;opacity:.13;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{filter:invert(1);opacity:.08;mix-blend-mode:screen}}
:root[data-theme="dark"] body::before{filter:invert(1);opacity:.08;mix-blend-mode:screen}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:Bitter,Georgia,serif;line-height:1.2;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.logo{width:132px;height:auto;border-radius:12px;background:#f3f0e8;flex:none}
.title{flex:1;min-width:200px}
.title h1{font-size:1.9rem}
.title p{margin:4px 0 12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input[type=search]{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:44px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:6px;padding:14px 16px;cursor:pointer}
.card h3{font-size:1.15rem;margin-bottom:6px}
.card small{color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:10px;padding:34px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:min(680px,calc(100vw - 20px));max-height:calc(100vh - 40px);padding:0}
dialog::backdrop{background:rgba(20,15,10,.55)}
.dl{padding:22px 22px 26px}
.meta{color:var(--muted);margin:6px 0 16px}
.dl h2{font-size:1.6rem}
.dl h3{font-size:1.1rem;margin:20px 0 8px}
.ing{list-style:none;padding:0;margin:0}
.ing li{padding:6px 0;border-bottom:1px solid var(--line)}
.ing label{display:flex;gap:10px;cursor:pointer}
.ing input:checked+span{text-decoration:line-through;color:var(--muted)}
ol.steps{padding-left:22px;margin:0}
ol.steps li{margin-bottom:10px}
.notes{background:var(--bg);border-radius:8px;padding:10px 14px;white-space:pre-wrap}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.row .sp{flex:1}
.f{display:block;margin-top:14px}
.f span{display:block;font-weight:600;margin-bottom:4px}
.f input,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.note-line{color:var(--muted);font-size:.9rem;margin-top:26px}
</style>
</head>

  <label class="f"><span>Name</span><input id="fTitle" required></label>
  <div class="two">
    <label class="f"><span>Category</span><input id="fCat" list="cats" placeholder="Bread, Treats…"></label>
    <label class="f"><span>Makes / time</span><input id="fMeta" placeholder="1 loaf · 24 hrs"></label>
  </div>
  <datalist id="cats"></datalist>
  <label class="f"><span>Ingredients</span><textarea id="fIng" rows="7"></textarea><p class="hint">One ingredient per line.</p></label>
  <label class="f"><span>Steps</span><textarea id="fSteps" rows="8"></textarea><p class="hint">One step per line.</p></label>
  <label class="f"><span>Notes</span><textarea id="fNotes" rows="3"></textarea></label>
  <div class="row"><button class="btn primary" id="save" type="button">Save recipe</button><button class="btn" id="cancel" type="button">Cancel</button></div>
</form></dialog>

<dialog id="login"><form class="dl" id="lf" onsubmit="return false"><h2>Sign in to edit</h2><label class="f"><span>Email</span><input id="lEmail" type="email" autocomplete="username"></label><label class="f"><span>Password</span><input id="lPw" type="password" autocomplete="current-password"></label><p class="hint" id="lErr" style="color:var(--danger)"></p><div class="row"><button class="btn primary" id="lGo" type="button">Sign in</button><button class="btn" id="lCancel" type="button">Cancel</button></div></form></dialog>
<script>
(function(){
/* ===== PASTE YOUR SUPABASE DETAILS HERE ===== */
var SB_URL='https://kgfsuvfpkfzhgwutmtdb.supabase.co';
var SB_KEY='sb_publishable_XWauw38w8DkLaPgVK0Pe6A_XT1Oh04l';
/* ============================================= */
var recipes=[],snap={},canEdit=false,loadErr=false,filter='All',editing=null,SK='rs-sb-session',sess=null;
try{sess=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){}
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function lines(t){return String(t||'').split('\n').map(function(x){return x.trim()}).filter(Boolean)}
var configured=SB_URL.indexOf('http')===0&&SB_KEY.indexOf('PASTE')<0;
function saveSess(s){sess=s;try{if(s)localStorage.setItem(SK,JSON.stringify(s));else localStorage.removeItem(SK)}catch(e){}}
async function auth(grant,body){
  var r=await fetch(SB_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB_KEY,'content-type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('auth');
  var j=await r.json();
  saveSess({access_token:j.access_token,refresh_token:j.refresh_token});
}
async function refresh(){
  if(!sess||!sess.refresh_token)return false;
  try{await auth('refresh_token',{refresh_token:sess.refresh_token});return true}catch(e){return false}
}
async function api(m,p,o){
  o=o||{};
  var h={apikey:SB_KEY,'content-type':'application/json'};
  if(sess)h.Authorization='Bearer '+sess.access_token;
  if(o.prefer)h.Prefer=o.prefer;
  var r=await fetch(SB_URL+'/rest/v1/'+p,{method:m,headers:h,body:o.body?JSON.stringify(o.body):undefined,cache:'no-store'});
  if(r.status===401&&sess&&!o.retried){
    if(await refresh())return api(m,p,{body:o.body,prefer:o.prefer,retried:true});
    saveSess(null);canEdit=false;render();throw new Error('auth');
  }
  if(!r.ok)throw new Error('http '+r.status);
  return m==='GET'?r.json():null;
}
async function load(){
  if(!configured){render();return}
  try{
    var rows=await api('GET','recipes?select=data');
    recipes=rows.map(function(x){return x.data}).filter(function(x){return x&&x.id});
    snap={};recipes.forEach(function(r){snap[r.id]=JSON.stringify(r)});
    canEdit=!!sess;loadErr=false;
  }catch(e){loadErr=true;canEdit=!!sess&&canEdit}
  render();
}
async function push(){
  var cur={};recipes.forEach(function(r){cur[r.id]=JSON.stringify(r)});
  var ups=recipes.filter(function(r){return snap[r.id]!==cur[r.id]});
  var dels=Object.keys(snap).filter(function(id){return !(id in cur)});
  try{
    if(ups.length)await api('POST','recipes',{body:ups.map(function(r){return {id:r.id,data:r}}),prefer:'resolution=merge-duplicates,return=minimal'});
    for(var i=0;i<dels.length;i++)await api('DELETE','recipes?id=eq.'+encodeURIComponent(dels[i]));
    snap=cur;
  }catch(e){alert('Couldn’t save. Check your connection or sign in again.');await load()}
}

function cats(){var s={};recipes.forEach(function(r){if(r.category)s[r.category]=1});return Object.keys(s).sort()}

function render(){
  $('count').textContent=recipes.length?recipes.length+(recipes.length===1?' recipe':' recipes'):'Your recipes live here.';
  $('add').style.display=canEdit?'':'none';$('unlock').style.display=canEdit||!configured?'none':'';$('out').style.display=canEdit?'':'none';
  
  $('mode').textContent=!configured?'Setup needed: add your Supabase details at the top of index.html.':loadErr?'Couldn’t load recipes. Check your connection and reload.':(canEdit?'':'View only. Sign in to add or change recipes.');
  var c=cats();if(filter!=='All'&&c.indexOf(filter)<0)filter='All';
  $('chips').innerHTML=c.length?['All'].concat(c).map(function(x){return '<button class="chip" type="button" data-c="'+esc(x)+'" aria-pressed="'+(x===filter)+'">'+esc(x)+'</button>'}).join(''):'';
  $('cats').innerHTML=c.map(function(x){return '<option value="'+esc(x)+'">'}).join('');
  var q=$('q').value.trim().toLowerCase();
  var list=recipes.filter(function(r){
    if(filter!=='All'&&r.category!==filter)return false;
    if(!q)return true;
    return (r.title+' '+(r.ingredients||[]).join(' ')).toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){return String(a.title).localeCompare(String(b.title))});
  if(!list.length){
    $('list').innerHTML=recipes.length?'<div class="empty"><h2>No matches</h2><p>Try a different search or category.</p></div>'
      :'<div class="empty"><h2>No recipes yet</h2><p>'+(canEdit?'Add your first recipe to start your book.':'Recipes will show up here.')+'</p>'+(canEdit?'<button class="btn primary" type="button" id="add2">Add recipe</button>':'')+'</div>';
    var a2=$('add2');if(a2)a2.onclick=function(){openEdit()};
    return;
  }
  $('list').innerHTML='<div class="grid">'+list.map(function(r){
    return '<button class="card" type="button" data-id="'+esc(r.id)+'"><h3>'+esc(r.title)+'</h3><small>'+esc([r.category,r.meta].filter(Boolean).join(' · '))+'</small></button>'}).join('')+'</div>';
}

function openView(id){
  var r=recipes.find(function(x){return x.id===id});if(!r)return;
  var h='<h2>'+esc(r.title)+'</h2><p class="meta">'+esc([r.category,r.meta].filter(Boolean).join(' · '))+'</p>';
  if((r.ingredients||[]).length)h+='<h3>Ingredients</h3><ul class="ing">'+r.ingredients.map(function(i){return '<li><label><input type="checkbox"><span>'+esc(i)+'</span></label></li>'}).join('')+'</ul>';
  if((r.steps||[]).length)h+='<h3>Steps</h3><ol class="steps">'+r.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>';
  if(r.notes)h+='<h3>Notes</h3><div class="notes">'+esc(r.notes)+'</div>';
  h+='<div class="row">'+(canEdit?'<button class="btn" type="button" id="vEdit">Edit</button><button class="btn danger" type="button" id="vDel">Delete</button>':'')+'<span class="sp"></span><button class="btn" type="button" id="vClose">Close</button></div>';
  $('viewBody').innerHTML=h;
  $('vClose').onclick=function(){$('view').close()};
  if(canEdit){
    $('vEdit').onclick=function(){$('view').close();openEdit(r)};
    $('vDel').onclick=function(){
      if($('vDel').dataset.sure!=='1'){$('vDel').dataset.sure='1';$('vDel').textContent='Tap again to delete';return}
      recipes=recipes.filter(function(x){return x.id!==r.id});render();push();$('view').close();
    };
  }
  $('view').showModal();
}

function openEdit(r){
  editing=r||null;
  $('formTitle').textContent=r?'Edit recipe':'Add recipe';
  $('fTitle').value=r?r.title:'';$('fCat').value=r?r.category||'':'';$('fMeta').value=r?r.meta||'':'';
  $('fIng').value=r?(r.ingredients||[]).join('\n'):'';$('fSteps').value=r?(r.steps||[]).join('\n'):'';$('fNotes').value=r?r.notes||'':'';
  $('edit').showModal();$('fTitle').focus();
}

$('save').onclick=function(){
  var t=$('fTitle').value.trim();
  if(!t){$('fTitle').focus();return}
  var rec={id:editing?editing.id:'r'+Date.now(),title:t,category:$('fCat').value.trim(),meta:$('fMeta').value.trim(),
    ingredients:lines($('fIng').value),steps:lines($('fSteps').value),notes:$('fNotes').value.trim()};
  var i=recipes.findIndex(function(x){return x.id===rec.id});
  if(i>=0)recipes[i]=rec;else recipes.push(rec);
  render();push();$('edit').close();
};
$('unlock').onclick=function(){$('lErr').textContent='';$('login').showModal();$('lEmail').focus()};
$('lCancel').onclick=function(){$('login').close()};
async function doLogin(){
  $('lErr').textContent='';
  try{await auth('password',{email:$('lEmail').value.trim(),password:$('lPw').value});$('lPw').value='';$('login').close();await load()}
  catch(e){$('lErr').textContent='That email or password didn’t work.'}
}
$('lGo').onclick=doLogin;
$('lf').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();doLogin()}};
$('out').onclick=function(){saveSess(null);canEdit=false;render()};
$('cancel').onclick=function(){$('edit').close()};
$('add').onclick=function(){openEdit()};
$('q').oninput=render;
$('chips').onclick=function(e){var b=e.target.closest('.chip');if(b){filter=b.dataset.c;render()}};
$('list').onclick=function(e){var b=e.target.closest('.card');if(b)openView(b.dataset.id)};
['view','edit','login'].forEach(function(id){$(id).addEventListener('click',function(e){if(e.target===$(id))$(id).close()})});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!$('edit').open&&!$('view').open)load()});
var lg=document.querySelector('.logo');if(lg)document.body.style.setProperty('--logo','url('+lg.getAttribute('src')+')');
load();
})();
</script>
</body>
</html>
